<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>רוקחים עולם</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Arial, "Assistant", sans-serif;
      background-image: url("background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #073b5c;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
    }

    .logo {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 86px;
      height: auto;
      z-index: 3;
    }

    .main-title {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 900;
      line-height: 1.05;
      text-align: center;
      white-space: nowrap;
      letter-spacing: -0.5px;
      z-index: 3;

      background: linear-gradient(135deg, #073b5c, #007c89, #1b6fb8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      filter:
        drop-shadow(0 2px 4px rgba(255, 255, 255, 0.65))
        drop-shadow(0 8px 18px rgba(9, 63, 95, 0.22));
    }

    .menu-box {
      position: absolute;
      top: 58%;
      left: 50%;
      transform: translateX(-50%);
      width: min(92%, 430px);
      padding: 16px 18px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.48);
      box-shadow: 0 14px 36px rgba(10, 70, 110, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 3;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .nav-button {
      min-width: 106px;
      padding: 11px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      color: #ffffff;
      background: linear-gradient(135deg, #0b6fa4, #0fa3a8);
      box-shadow: 0 8px 18px rgba(5, 88, 130, 0.24);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .nav-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(5, 88, 130, 0.3);
      opacity: 0.96;
    }

    .nav-button:nth-child(2) {
      background: linear-gradient(135deg, #cf3f68, #e56d44);
      box-shadow: 0 8px 18px rgba(207, 63, 104, 0.24);
    }

    .nav-button:nth-child(3) {
      background: linear-gradient(135deg, #2f6fd3, #6856c7);
      box-shadow: 0 8px 18px rgba(47, 111, 211, 0.24);
    }

    @media (max-width: 600px) {
      body {
        overflow: auto;
      }

      .logo {
        top: 24px;
        width: 76px;
      }

      .main-title {
        top: 38%;
        width: 90%;
        white-space: normal;
        font-size: clamp(2.1rem, 10vw, 3rem);
      }

      .menu-box {
        top: 58%;
        width: min(88%, 310px);
        padding: 18px 16px;
      }

      .buttons {
        flex-direction: column;
        gap: 10px;
      }

      .nav-button {
        width: 190px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <img src="logo.png" alt="לוגו" class="logo" />

    <h1 class="main-title">רוקחים עולם</h1>

    <section class="menu-box" aria-label="תפריט ניווט">
      <nav class="buttons">
        <a class="nav-button" href="poster.html">פוסטר</a>
        <a class="nav-button" href="pitch.html">פיץ׳</a>
        <a class="nav-button" href="presentation.html">פרזנטציה</a>
      </nav>
    </section>
  </main>
</body>
</html>
